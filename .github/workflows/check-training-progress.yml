name: Inspect training checkpoint
on:
  push:
    paths:
      - .github/workflows/check-training-progress.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIN_RELEASE: sanskrit-250m-44002147943
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Inspect most recent checkpoint
        run: |
          asset=$(gh release view "$TRAIN_RELEASE" --json assets --jq '[.assets[] | select(.name | test("^checkpoint-[0-9]+-[0-9]+\\.pt$"))] | sort_by(.createdAt) | last | .name')
          test -n "$asset"
          gh release download "$TRAIN_RELEASE" --pattern "$asset" --pattern "$asset.sha256"
          sha256sum -c "$asset.sha256"
          ASSET="$asset" python - <<'PY'
          import json, os, torch
          checkpoint = torch.load(os.environ['ASSET'], map_location='cpu', weights_only=False)
          step = int(checkpoint['step'])
          result = {'asset': os.environ['ASSET'], 'step': step, 'tokens': step * 4096,
                    'optimizer_present': bool(checkpoint.get('optimizer'))}
          print(json.dumps(result))
          with open('progress-inspection.json', 'w') as f:
              json.dump(result, f)
          PY
          gh release upload "$TRAIN_RELEASE" progress-inspection.json --clobber
