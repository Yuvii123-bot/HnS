name: Collect candidate Sanskrit books for review
on:
  push:
    paths:
      - .github/workflows/collect-sanskrit-books.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download source OCR and metadata without training
        run: python scripts/collect_sanskrit_books.py
      - uses: actions/upload-artifact@v4
        with:
          name: quarantined-sanskrit-book-sources
          path: book-review/
          if-no-files-found: error
          retention-days: 7
