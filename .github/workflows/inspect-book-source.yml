name: Inspect original Sanskrit book source
on:
  push:
    paths:
      - .github/workflows/inspect-book-source.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Test access to the original chapter
        run: |
          python - <<'PY'
          import urllib.request
          url='https://en.amarahasa.com/books/harini-sukam-pasyati/1/'
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=30) as r:
                  text=r.read().decode('utf-8')
              print('::notice::Original chapter accessible; characters=' + str(len(text)))
              open('chapter.html','w',encoding='utf-8').write(text)
          except Exception as exc:
              print('::error::Original chapter fetch failed: ' + type(exc).__name__ + ': ' + str(exc))
              raise
          PY
      - name: Preserve sample for extraction audit
        run: |
          mkdir -p data/book_candidates/original_sample
          cp chapter.html data/book_candidates/original_sample/harini-chapter-1.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/book_candidates/original_sample/harini-chapter-1.html
          git commit -m 'Preserve original chapter for text extraction audit'
          git push origin HEAD:${{ github.ref_name }}
