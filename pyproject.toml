[project]
name = "sanskrit-llm"
version = "0.1.0"
description = "An aksara-native Sanskrit language model"
requires-python = ">=3.10"
# Deployment runtime deps only. Vercel's Python builder installs from this
# table, so torch must never appear here (it would blow the 500 MB function
# limit). Local training deps live in requirements-dev.txt.
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
